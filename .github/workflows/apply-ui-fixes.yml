name: Apply UI fixes

on:
  push:
    paths:
      - ".ui-fix-trigger"

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch App.jsx and App.css
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          css = Path('src/App.css')

          app_text = app.read_text(encoding='utf-8')
          marker = '  // =====================================================\n  // INITIALISATION\n  // =====================================================\n'
          effect = '''  // =====================================================\n  // SYNCHRONISATION DU THÈME SYSTÈME\n  // =====================================================\n\n  useEffect(() => {\n    const media = window.matchMedia("(prefers-color-scheme: dark)");\n\n    const syncTheme = () => {\n      document.documentElement.dataset.theme = media.matches ? "dark" : "light";\n    };\n\n    syncTheme();\n    media.addEventListener?.("change", syncTheme);\n\n    return () => media.removeEventListener?.("change", syncTheme);\n  }, []);\n\n'''
          if effect not in app_text:
              if marker not in app_text:
                  raise SystemExit('App.jsx marker not found')
              app_text = app_text.replace(marker, effect + marker, 1)
              app.write_text(app_text, encoding='utf-8')

          fixes = r'''

/* =====================================================
   UI FIXES — THÈME SYSTÈME + MOBILE
   Ces règles sont placées en dernier pour corriger les
   couleurs fixes et les débordements sur petits écrans.
===================================================== */

html,
body,
#root {
  max-width: 100%;
  overflow-x: hidden;
}

html {
  color-scheme: light;
}

html[data-theme="light"] {
  color-scheme: light;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --black: #f5f5f2;
  --black-soft: #e8e8e3;
  --white: #151514;
  --background: #111210;
  --surface: #1a1b18;
  --surface-soft: #22231f;
  --border: #353630;
  --border-soft: #2b2c28;
  --text: #f3f3ee;
  --muted: #b4b5ad;
  --muted-light: #92938b;
  --lime: #c8ff4d;
  --lime-dark: #c8ff4d;
  --lime-soft: #27321a;
  --danger: #ff7777;
  --danger-soft: #3a2020;
  --success: #c8ef78;
  --success-soft: #26321a;
  --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.18);
  --shadow-md: 0 12px 35px rgba(0, 0, 0, 0.28);
  --shadow-lg: 0 25px 70px rgba(0, 0, 0, 0.38);
}

@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    color-scheme: dark;
    --black: #f5f5f2;
    --black-soft: #e8e8e3;
    --white: #151514;
    --background: #111210;
    --surface: #1a1b18;
    --surface-soft: #22231f;
    --border: #353630;
    --border-soft: #2b2c28;
    --text: #f3f3ee;
    --muted: #b4b5ad;
    --muted-light: #92938b;
    --lime: #c8ff4d;
    --lime-dark: #c8ff4d;
    --lime-soft: #27321a;
    --danger: #ff7777;
    --danger-soft: #3a2020;
    --success: #c8ef78;
    --success-soft: #26321a;
  }
}

/* Les anciennes couleurs fixes ne doivent plus rendre le texte invisible. */
html[data-theme="dark"] body,
html[data-theme="dark"] .dashboard,
html[data-theme="dark"] .auth-page,
html[data-theme="dark"] .landing-page,
html[data-theme="dark"] .loading-screen {
  background-color: var(--background);
  color: var(--text);
}

html[data-theme="dark"] .dashboard-header,
html[data-theme="dark"] .auth-card,
html[data-theme="dark"] .main-card,
html[data-theme="dark"] .info-card,
html[data-theme="dark"] .recent-card,
html[data-theme="dark"] .quote-card,
html[data-theme="dark"] .season-list,
html[data-theme="dark"] .profile-form,
html[data-theme="dark"] .profile-card,
html[data-theme="dark"] .profile-identity,
html[data-theme="dark"] .competition-card,
html[data-theme="dark"] .bilan-card,
html[data-theme="dark"] .coach-athlete-panel,
html[data-theme="dark"] .floating-card,
html[data-theme="dark"] .modal-card {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
}

html[data-theme="dark"] input,
html[data-theme="dark"] textarea,
html[data-theme="dark"] select,
html[data-theme="dark"] .auth-card input,
html[data-theme="dark"] .profile-form input,
html[data-theme="dark"] .profile-card input,
html[data-theme="dark"] .profile-form textarea,
html[data-theme="dark"] .profile-card textarea,
html[data-theme="dark"] .profile-form select {
  background: var(--surface-soft);
  color: var(--text);
  border-color: var(--border);
}

html[data-theme="dark"] input::placeholder,
html[data-theme="dark"] textarea::placeholder {
  color: var(--muted-light);
}

html[data-theme="dark"] .main-nav button,
html[data-theme="dark"] .profile-tabs button,
html[data-theme="dark"] .back-button,
html[data-theme="dark"] .auth-switch,
html[data-theme="dark"] .description,
html[data-theme="dark"] .landing-content p,
html[data-theme="dark"] .landing-label,
html[data-theme="dark"] .section-label,
html[data-theme="dark"] .eyebrow,
html[data-theme="dark"] .card-label,
html[data-theme="dark"] .text-muted,
html[data-theme="dark"] .warning,
html[data-theme="dark"] .landing-footer,
html[data-theme="dark"] .dashboard-footer,
html[data-theme="dark"] .floating-card span,
html[data-theme="dark"] .floating-card small {
  color: var(--muted);
}

html[data-theme="dark"] .login-button,
html[data-theme="dark"] .secondary-button,
html[data-theme="dark"] .outline-button {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
}

html[data-theme="dark"] .auth-message {
  background: var(--surface-soft);
  color: var(--text);
}

html[data-theme="dark"] .success-message {
  background: var(--success-soft);
  color: var(--success);
}

/* Navigation mobile : les boutons restent contenus dans l'écran. */
.main-nav,
.profile-tabs,
.coach-tabs,
.athlete-profile-tabs {
  min-width: 0;
  max-width: 100%;
}

.main-nav button,
.profile-tabs button,
.coach-tabs button,
.athlete-profile-tabs button {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: normal;
}

.main-nav button {
  white-space: normal !important;
  line-height: 1.15;
}

button,
a,
span,
p,
h1,
h2,
h3,
h4,
h5,
h6,
label,
strong {
  max-width: 100%;
  overflow-wrap: anywhere;
}

img,
svg,
video,
canvas {
  max-width: 100%;
}

@media (max-width: 650px) {
  .dashboard-header {
    padding: 10px 12px;
    min-height: 70px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .dashboard-header .brand {
    min-width: 0;
    flex: 0 0 auto;
  }

  .main-nav {
    order: 3;
    width: 100%;
    flex: 0 0 100%;
    justify-content: flex-start;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 2px 0 4px;
  }

  .main-nav::-webkit-scrollbar {
    display: none;
  }

  .main-nav button {
    flex: 0 0 auto;
    white-space: nowrap !important;
    padding: 9px 11px;
    font-size: 12px;
  }

  .page-heading,
  .section-heading,
  .competition-card-header,
  .coach-athlete-header,
  .question-top {
    min-width: 0;
  }

  .page-heading h1,
  .welcome-section h1 {
    overflow-wrap: anywhere;
  }

  .form-row,
  .dashboard-grid,
  .bottom-grid,
  .coach-overview-grid {
    min-width: 0;
  }

  .competition-row {
    min-width: 0;
  }

  .competition-row > div {
    min-width: 0 !important;
    max-width: 100%;
  }

  .competition-row h3,
  .competition-row p {
    overflow-wrap: anywhere;
  }

  .profile-tabs {
    display: flex;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .profile-tabs::-webkit-scrollbar {
    display: none;
  }

  .profile-tabs button {
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .question-management-card,
  .question-management-actions,
  .invitation-code {
    min-width: 0;
  }

  .large-submit,
  .primary-button,
  .secondary-button,
  .outline-button,
  .logout-button {
    max-width: 100%;
    white-space: normal;
    overflow-wrap: anywhere;
  }
}

@media (max-width: 420px) {
  .main-nav button {
    padding: 8px 9px;
    font-size: 11px;
  }

  .brand {
    font-size: 17px;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
  }

  .page-heading h1 {
    font-size: 34px;
  }

  .welcome-section h1 {
    font-size: 34px;
  }

  .main-card,
  .info-card,
  .recent-card,
  .quote-card,
  .season-list,
  .profile-form,
  .profile-identity,
  .competition-card,
  .bilan-card,
  .coach-athlete-panel {
    padding: 17px;
  }
}
'''
          css_text = css.read_text(encoding='utf-8')
          if 'UI FIXES — THÈME SYSTÈME + MOBILE' not in css_text:
              css.write_text(css_text.rstrip() + fixes + '\n', encoding='utf-8')
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          rm -f .ui-fix-trigger .github/workflows/apply-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/App.css .ui-fix-trigger .github/workflows/apply-ui-fixes.yml
          git commit -m "fix: improve mobile layout and dark mode"
          git push